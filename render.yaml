# Render Blueprint: one database, one backend (web service) and one frontend (static site).
# If a name below is already taken on Render, add a suffix, then use the URLs Render shows you.
databases:
  - name: resilience-db
    databaseName: resilience
    user: resilience
    plan: free

services:
  - type: web
    name: mca-resilience-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resilience-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: mca-resilience-app
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
